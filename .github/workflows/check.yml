name: Check

on:
  push:
    branches: ['**']   # not tags: a release tag points at a commit already checked
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Explicit packages: the action's default includes 'tools', which Google retired.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Tests (format, kit, ink) and build
        run: gradle test assembleDebug --no-daemon
